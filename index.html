<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物联网协议解码平台</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2e; --panel2: #1d2638; --border: #2a3650;
    --text: #d7e0f0; --dim: #8a97b0; --accent: #4da3ff; --ok: #3ecf8e;
    --warn: #f5a623; --err: #ef5566; --mono: "Cascadia Code", Consolas, "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--border); }
  header h1 { font-size: 17px; margin: 0; }
  nav { display: flex; gap: 4px; }
  nav button { background: none; border: none; color: var(--dim); padding: 8px 14px; cursor: pointer; font-size: 14px; border-bottom: 2px solid transparent; }
  nav button.active { color: var(--accent); border-bottom-color: var(--accent); }
  nav button:hover { color: var(--text); }
  main { padding: 16px 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .panel h2 { margin: 0 0 12px; font-size: 15px; color: var(--accent); }
  button.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 6px 14px; cursor: pointer; font-size: 13px; }
  button.btn:hover { border-color: var(--accent); }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 600; }
  button.btn.danger { color: var(--err); }
  select, input[type=text], textarea { background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 6px 10px; font-size: 13px; }
  textarea { width: 100%; font-family: var(--mono); font-size: 12.5px; }
  label { color: var(--dim); font-size: 13px; margin-right: 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
  th { background: var(--panel2); color: var(--dim); font-weight: 500; }
  tr:hover td { background: rgba(77,163,255,.05); }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 10px; font-size: 12px; }
  .badge.ok { background: rgba(62,207,142,.15); color: var(--ok); }
  .badge.err { background: rgba(239,85,102,.15); color: var(--err); }
  .badge.warn { background: rgba(245,166,35,.15); color: var(--warn); }
  .muted { color: var(--dim); }
  /* 解析视图 */
  .parse-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .hexview { font-family: var(--mono); font-size: 12.5px; line-height: 1.7; overflow-x: auto; white-space: nowrap; }
  .hexview .off { color: var(--dim); user-select: none; }
  .hexview .ascii { color: var(--dim); }
  .hexview span.b { display: inline-block; padding: 0 1px; border-radius: 3px; cursor: default; }
  .hexview span.b.f0 { background: rgba(77,163,255,.13); } .hexview span.b.f1 { background: rgba(62,207,142,.13); }
  .hexview span.b.f2 { background: rgba(245,166,35,.13); } .hexview span.b.f3 { background: rgba(178,107,255,.13); }
  .hexview span.b.f4 { background: rgba(239,85,102,.13); } .hexview span.b.f5 { background: rgba(80,220,220,.13); }
  .hexview span.b.f6 { background: rgba(240,200,90,.13); } .hexview span.b.f7 { background: rgba(150,190,255,.13); }
  .hexview span.b.hl { background: var(--accent) !important; color: #06121f; }
  .hexview span.b.err { text-decoration: underline wavy var(--err); }
  .tree { font-family: var(--mono); font-size: 12.5px; max-height: 560px; overflow: auto; }
  .tree ul { list-style: none; padding-left: 18px; margin: 0; }
  .tree > ul { padding-left: 0; }
  .tree .node { padding: 1px 6px; border-radius: 4px; cursor: default; white-space: nowrap; }
  .tree .node:hover { background: rgba(77,163,255,.12); }
  .tree .node.hl { background: var(--accent); color: #06121f; }
  .tree .name { color: #9ecbff; }
  .tree .node.hl .name, .tree .node.hl .val, .tree .node.hl .meta { color: #06121f; }
  .tree .val { color: #ffd479; }
  .tree .meta { color: var(--dim); font-size: 11.5px; }
  .tree .err { color: var(--err); }
  .summary-cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 18px; min-width: 110px; }
  .card .num { font-size: 22px; font-weight: 700; }
  .card .lbl { color: var(--dim); font-size: 12px; }
  .hidden { display: none !important; }
  .notes { color: var(--warn); font-size: 13px; }
  .notes li { margin: 2px 0; }
  .split { display: grid; grid-template-columns: 260px 1fr; gap: 16px; }
  .list-item { padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .list-item:hover { background: rgba(77,163,255,.08); }
  .list-item.active { background: rgba(77,163,255,.16); }
  .list-item .sub { color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>物联网协议解码平台</h1>
  <nav id="tabs">
    <button data-tab="library" class="active">协议库</button>
    <button data-tab="editor">协议编辑</button>
    <button data-tab="parse">报文解析</button>
    <button data-tab="batch">批量解码</button>
    <button data-tab="stats">字段统计</button>
  </nav>
</header>
<main>
  <section id="tab-library"></section>
  <section id="tab-editor" class="hidden"></section>
  <section id="tab-parse" class="hidden"></section>
  <section id="tab-batch" class="hidden"></section>
  <section id="tab-stats" class="hidden"></section>
</main>
<script type="module" src="dist/ui/app.js"></script>
</body>
</html>
